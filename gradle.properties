#Gradle
org.gradle.jvmargs=-Xmx4G
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.daemon=true
org.gradle.parallel=true

#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx4G
kotlin.native.binary.gc=cms
kotlin.incremental.wasm=true

#Android
android.useAndroidX=true
android.nonTransitiveRClass=true

appVersionName=1.0.0
appVersionCode=1

# Single source of truth for the Datadog service name and site, shared between the
# BuildKonfig-generated app config (shared/build.gradle.kts) and the debug-symbol upload
# tooling (androidApp/build.gradle.kts, ios-release.yml)
# KEEP IN SYNC WITH GitHub action workflow files
datadogServiceName=cmp-template
datadogSite=EU1

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
