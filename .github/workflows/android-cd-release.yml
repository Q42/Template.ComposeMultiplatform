name: Android CD release

on:
  push:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: android-cd-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-artifacts:
    runs-on: [ self-hosted, macOS ]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "corretto"
          java-version: "21"
          cache: gradle

      - name: Resolve app version metadata
        id: app_meta
        shell: bash
        run: |
          VERSION_OUTPUT=$(./gradlew -q :composeApp:printAppVersionMetadata)
          VERSION_NAME=$(echo "$VERSION_OUTPUT" | grep '^VERSION_NAME=' | head -n1 | cut -d'=' -f2-)
          VERSION_CODE=$(echo "$VERSION_OUTPUT" | grep '^VERSION_CODE=' | head -n1 | cut -d'=' -f2-)

          if [[ -z "$VERSION_NAME" ]]; then VERSION_NAME="unknown"; fi
          if [[ -z "$VERSION_CODE" ]]; then VERSION_CODE="unknown"; fi

          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Build Android release artifacts
        run: ./gradlew :composeApp:assembleRelease :composeApp:bundleRelease --stacktrace -x :composeApp:linkDebugFrameworkIosSimulatorArm64 -x :composeApp:linkReleaseFrameworkIosSimulatorArm64

      - name: Upload release APK
        uses: actions/upload-artifact@v5
        with:
          name: ${{ github.event.repository.name }}-${{ github.run_number }}-v${{ steps.app_meta.outputs.version_name }}-${{ steps.app_meta.outputs.version_code }}-release-apk
          path: ${{ github.workspace }}/composeApp/build/outputs/apk/release/composeApp-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload release AAB
        uses: actions/upload-artifact@v5
        with:
          name: ${{ github.event.repository.name }}-${{ github.run_number }}-v${{ steps.app_meta.outputs.version_name }}-${{ steps.app_meta.outputs.version_code }}-release-aab
          path: ${{ github.workspace }}/composeApp/build/outputs/bundle/release/composeApp-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Add workflow summary
        run: |
          {
            echo "## Android release artifacts"
            echo "- Version name: \`${{ steps.app_meta.outputs.version_name }}\`"
            echo "- Version code: \`${{ steps.app_meta.outputs.version_code }}\`"
            echo "- Artifacts: release APK and release AAB"
          } >> "$GITHUB_STEP_SUMMARY"
