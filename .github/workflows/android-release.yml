name: Android build release

on:
  # Show a manual trigger button in the GitHub Actions UI
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  release-android:
    name: Deploy Android app
    # To use the self-hosted runner, change to `runs-on: [self-hosted, macOS]`
    runs-on: [macos-26]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Resolve app version metadata
        id: app_meta
        shell: bash
        run: |
          VERSION_OUTPUT=$(./gradlew -q :shared:printAppVersionMetadata)
          VERSION_NAME=$(echo "$VERSION_OUTPUT" | grep '^VERSION_NAME=' | head -n1 | cut -d'=' -f2-)
          VERSION_CODE=$(echo "$VERSION_OUTPUT" | grep '^VERSION_CODE=' | head -n1 | cut -d'=' -f2-)

          if [[ -z "$VERSION_NAME" ]]; then VERSION_NAME="unknown"; fi
          if [[ -z "$VERSION_CODE" ]]; then VERSION_CODE="unknown"; fi

          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      # Signing and the Firebase App Distribution upload are optional, see "Android release signing and
      # Firebase App Distribution" in the README. Without these secrets the release build stays unsigned.
      - name: Check optional release secrets
        id: release_secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_CREDENTIALS }}
        run: |
          echo "signing=$([[ -n "$ANDROID_KEYSTORE_BASE64" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "firebase=$([[ -n "$FIREBASE_CREDENTIALS" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Decode release keystore
        if: steps.release_secrets.outputs.signing == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build Android release artifacts
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew \
            :androidApp:assembleRelease \
            :androidApp:bundleRelease \
            -Papp.versionNameOverride=${{ steps.app_meta.outputs.version_name }} \
            -Papp.versionCodeOverride=${{ steps.app_meta.outputs.version_code }} \
            --stacktrace

      - name: List generated release outputs
        shell: bash
        run: |
          echo "APK outputs:"
          ls -la "${{ github.workspace }}/androidApp/build/outputs/apk/release" || true
          echo "AAB outputs:"
          ls -la "${{ github.workspace }}/androidApp/build/outputs/bundle/release" || true

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.repository.name }}-${{ github.run_number }}-v${{ steps.app_meta.outputs.version_name }}-${{ steps.app_meta.outputs.version_code }}-release-apk
          path: ${{ github.workspace }}/androidApp/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload release AAB
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.repository.name }}-${{ github.run_number }}-v${{ steps.app_meta.outputs.version_name }}-${{ steps.app_meta.outputs.version_code }}-release-aab
          path: ${{ github.workspace }}/androidApp/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30

      # Uses the App Distribution Gradle plugin, so we don't depend on a third-party GitHub action
      - name: Upload release APK to Firebase App Distribution
        if: steps.release_secrets.outputs.signing == 'true' && steps.release_secrets.outputs.firebase == 'true'
        env:
          FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_CREDENTIALS }}
          FIREBASE_RELEASE_NOTES: Release build for ${{ github.ref_name }} branch - v${{ steps.app_meta.outputs.version_name }} (${{ steps.app_meta.outputs.version_code }}) - ${{ github.sha }}
        run: |
          echo "$FIREBASE_CREDENTIALS" > "$RUNNER_TEMP/firebase-credentials.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-credentials.json"
          ./gradlew :androidApp:appDistributionUploadRelease \
            -Papp.versionNameOverride=${{ steps.app_meta.outputs.version_name }} \
            -Papp.versionCodeOverride=${{ steps.app_meta.outputs.version_code }} \
            --stacktrace

      - name: Add workflow summary
        run: |
          {
            echo "## Android release artifacts"
            echo "- Version name: \`${{ steps.app_meta.outputs.version_name }}\`"
            echo "- Version code: \`${{ steps.app_meta.outputs.version_code }}\`"
            echo "- Artifacts: release APK and release AAB"
            echo "- Signed: ${{ steps.release_secrets.outputs.signing }}"
            echo "- Uploaded to Firebase App Distribution: ${{ steps.release_secrets.outputs.signing == 'true' && steps.release_secrets.outputs.firebase == 'true' }}"
          } >> "$GITHUB_STEP_SUMMARY"
