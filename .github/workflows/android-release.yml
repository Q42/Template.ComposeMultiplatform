name: Android build release

on:
  # Show a manual trigger button in the GitHub Actions UI
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  release-android:
    name: Deploy Android app
    # To use the self-hosted runner, change to `runs-on: [self-hosted, macOS]`
    runs-on: [macos-26]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Resolve app version metadata
        id: app_meta
        shell: bash
        run: |
          VERSION_OUTPUT=$(./gradlew -q :shared:printAppVersionMetadata)
          VERSION_NAME=$(echo "$VERSION_OUTPUT" | grep '^VERSION_NAME=' | head -n1 | cut -d'=' -f2-)
          VERSION_CODE=$(echo "$VERSION_OUTPUT" | grep '^VERSION_CODE=' | head -n1 | cut -d'=' -f2-)

          if [[ -z "$VERSION_NAME" ]]; then VERSION_NAME="unknown"; fi
          if [[ -z "$VERSION_CODE" ]]; then VERSION_CODE="unknown"; fi

          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      # Signing and the Firebase App Distribution upload are optional, see "Android release signing and
      # Firebase App Distribution" in the README. Without these secrets the release build stays unsigned.
      - name: Check optional release secrets
        id: release_secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_CREDENTIALS }}
        run: |
          # Prints the names of the given environment variables that are empty, e.g. "`A`, `B`"
          missing() {
            local names=()
            for name in "$@"; do
              if [[ -z "${!name}" ]]; then names+=("\`$name\`"); fi
            done
            local joined
            joined=$(printf ', %s' "${names[@]}")
            echo "${joined:2}"
          }

          SIGNING_MISSING=$(missing ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD)
          FIREBASE_MISSING=$(missing FIREBASE_CREDENTIALS)

          echo "signing=$([[ -z "$SIGNING_MISSING" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "signing_missing=$SIGNING_MISSING" >> "$GITHUB_OUTPUT"
          echo "firebase=$([[ -z "$FIREBASE_MISSING" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "firebase_missing=$FIREBASE_MISSING" >> "$GITHUB_OUTPUT"

      - name: Decode release keystore
        if: steps.release_secrets.outputs.signing == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build Android release artifacts
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew \
            :androidApp:assembleRelease \
            :androidApp:bundleRelease \
            -Papp.versionNameOverride=${{ steps.app_meta.outputs.version_name }} \
            -Papp.versionCodeOverride=${{ steps.app_meta.outputs.version_code }} \
            --stacktrace

      - name: List generated release outputs
        shell: bash
        run: |
          echo "APK outputs:"
          ls -la "${{ github.workspace }}/androidApp/build/outputs/apk/release" || true
          echo "AAB outputs:"
          ls -la "${{ github.workspace }}/androidApp/build/outputs/bundle/release" || true

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.repository.name }}-${{ github.run_number }}-v${{ steps.app_meta.outputs.version_name }}-${{ steps.app_meta.outputs.version_code }}-release-apk
          path: ${{ github.workspace }}/androidApp/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload release AAB
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.repository.name }}-${{ github.run_number }}-v${{ steps.app_meta.outputs.version_name }}-${{ steps.app_meta.outputs.version_code }}-release-aab
          path: ${{ github.workspace }}/androidApp/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30

      # Uses the App Distribution Gradle plugin, so we don't depend on a third-party GitHub action
      - name: Upload release APK to Firebase App Distribution
        id: firebase_upload
        shell: bash
        if: steps.release_secrets.outputs.signing == 'true' && steps.release_secrets.outputs.firebase == 'true'
        env:
          FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_CREDENTIALS }}
          FIREBASE_RELEASE_NOTES: Release build for ${{ github.ref_name }} branch - v${{ steps.app_meta.outputs.version_name }} (${{ steps.app_meta.outputs.version_code }}) - ${{ github.sha }}
        run: |
          echo "$FIREBASE_CREDENTIALS" > "$RUNNER_TEMP/firebase-credentials.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-credentials.json"
          ./gradlew :androidApp:appDistributionUploadRelease \
            -Papp.versionNameOverride=${{ steps.app_meta.outputs.version_name }} \
            -Papp.versionCodeOverride=${{ steps.app_meta.outputs.version_code }} \
            --stacktrace | tee "$RUNNER_TEMP/firebase-upload.log"

          RELEASE_URL=$(grep -o 'https://console.firebase.google.com/[^ ]*' "$RUNNER_TEMP/firebase-upload.log" | head -n 1 || true)
          echo "release_url=$RELEASE_URL" >> "$GITHUB_OUTPUT"

      - name: Add workflow summary
        if: ${{ !cancelled() }}
        shell: bash
        env:
          VERSION_NAME: ${{ steps.app_meta.outputs.version_name }}
          VERSION_CODE: ${{ steps.app_meta.outputs.version_code }}
          SIGNING: ${{ steps.release_secrets.outputs.signing }}
          SIGNING_MISSING: ${{ steps.release_secrets.outputs.signing_missing }}
          FIREBASE: ${{ steps.release_secrets.outputs.firebase }}
          FIREBASE_MISSING: ${{ steps.release_secrets.outputs.firebase_missing }}
          FIREBASE_UPLOAD_OUTCOME: ${{ steps.firebase_upload.outcome }}
          RELEASE_URL: ${{ steps.firebase_upload.outputs.release_url }}
        run: |
          {
            echo "## Android release artifacts"
            echo "- Version name: \`$VERSION_NAME\`"
            echo "- Version code: \`$VERSION_CODE\`"
            echo "- Artifacts: release APK and release AAB"
            echo

            echo "### Signing"
            if [[ "$SIGNING" == "true" ]]; then
              echo "The release build is signed with the release keystore."
            else
              echo "The release build is **not signed**. Missing secrets: $SIGNING_MISSING"
            fi
            echo

            echo "### Firebase App Distribution"
            if [[ "$FIREBASE_UPLOAD_OUTCOME" == "success" ]]; then
              if [[ -n "$RELEASE_URL" ]]; then
                echo "Uploaded to the \`beta-testers\` group: [view the release in the Firebase console]($RELEASE_URL)"
              else
                echo "Uploaded to the \`beta-testers\` group."
              fi
            elif [[ "$FIREBASE_UPLOAD_OUTCOME" == "failure" ]]; then
              echo "The upload **failed**, see the logs of the upload step."
            else
              echo "**Not uploaded**:"
              if [[ "$SIGNING" != "true" ]]; then echo "- the release build is not signed"; fi
              if [[ "$FIREBASE" != "true" ]]; then echo "- missing secrets: $FIREBASE_MISSING"; fi
            fi
            if [[ "$SIGNING" != "true" || "$FIREBASE" != "true" ]]; then
              echo
              echo "See the README section \"Android release signing and Firebase App Distribution\" for the setup."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
