name: iOS build release

on:
  # Show a manual trigger button in the GitHub Actions UI
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ios-cd-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODE_VERSION: '26'
  XCODE_PROJECT: iosApp/iosApp.xcodeproj
  ARCHIVE_PATH: iosApp.xcarchive
  EXPORT_OPTIONS_PLIST_PATH: ExportOptions.plist

jobs:
  release-ios:
    name: Deploy iOS ${{ matrix.environment.name }} app to TestFlight
    runs-on: [ self-hosted, macOS ]

    strategy:
      matrix:
        environment:
          # Builds for additional environments may be configured here
          - name: production
            scheme: iosApp
            app_identifier: nl.q42.template.iosApp
            code_sign_entitlements: iosApp/Configuration/Production.entitlements

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "corretto"
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Resolve app version metadata
        id: app_meta
        shell: bash
        run: |
          VERSION_OUTPUT=$(./gradlew -q :shared:printAppVersionMetadata)
          VERSION_NAME=$(echo "$VERSION_OUTPUT" | grep '^VERSION_NAME=' | head -n1 | cut -d'=' -f2-)
          VERSION_CODE=$(echo "$VERSION_OUTPUT" | grep '^VERSION_CODE=' | head -n1 | cut -d'=' -f2-)

          if [[ -z "$VERSION_NAME" ]]; then VERSION_NAME="unknown"; fi
          if [[ -z "$VERSION_CODE" ]]; then VERSION_CODE="unknown"; fi

          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Cache Swift Package Manager dependencies
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Cache Kotlin Native toolchain
        uses: actions/cache@v5
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('**/libs.versions.toml', '**/gradle-wrapper.properties') }}
          restore-keys: |
            konan-${{ runner.os }}-

      - name: Install Swift packages
        run: |
          xcodebuild -project "${{ env.XCODE_PROJECT }}" \
            -scheme "${{ matrix.environment.scheme }}" \
            -onlyUsePackageVersionsFromResolvedFile \
            -resolvePackageDependencies \
            -clonedSourcePackagesDirPath "${{ runner.temp }}/SourcePackages"

      - name: Install code signing certificate
        uses: q42/actions/install-certificate@v1
        with:
          build-certificate-base64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          certificate-password: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}

      - name: Install App Store Connect API key
        id: app-store-connect-key
        run: |
          APP_STORE_CONNECT_API_KEY_PATH="${{ runner.temp }}/AuthKey.p8"
          echo "path=$APP_STORE_CONNECT_API_KEY_PATH" >> "$GITHUB_OUTPUT"
          echo -n "${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}" | base64 --decode -o "$APP_STORE_CONNECT_API_KEY_PATH"

      - name: Build iOS app
        run: |
          xcodebuild clean archive \
            -project "${{ env.XCODE_PROJECT }}" \
            -scheme "${{ matrix.environment.scheme }}" \
            -destination generic/platform=iOS \
            -archivePath "${{ runner.temp }}/${{ env.ARCHIVE_PATH }}" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "${{ steps.app-store-connect-key.outputs.path }}" \
            -authenticationKeyID ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }} \
            -clonedSourcePackagesDirPath "${{ runner.temp }}/SourcePackages" \
            -disableAutomaticPackageResolution \
            DEVELOPMENT_TEAM=${{ secrets.APPLE_DEVELOPER_TEAM_ID }} \
            PRODUCT_BUNDLE_IDENTIFIER=${{ matrix.environment.app_identifier }} \
            CODE_SIGN_ENTITLEMENTS=${{ matrix.environment.code_sign_entitlements }} \
            MARKETING_VERSION=${{ steps.app_meta.outputs.version_name }} \
            CURRENT_PROJECT_VERSION=${{ steps.app_meta.outputs.version_code }}

      # site is datadoghq.eu (the upload-dsyms action's domain-style site format), matching
      # datadogSite=EU1 in gradle.properties (the DatadogSite enum format shared/build.gradle.kts uses).
      - name: Upload dSYMs to Datadog
        uses: DataDog/upload-dsyms-github-action@v1
        with:
          api_key: ${{ secrets.DATADOG_API_KEY }}
          site: datadoghq.eu
          dsym_paths: ${{ runner.temp }}/${{ env.ARCHIVE_PATH }}/dSYMs

      - name: Write export options plist
        run: |
          cat << EOF > ${{ env.EXPORT_OPTIONS_PLIST_PATH }}
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>destination</key>
            <string>upload</string>
            <key>generateAppStoreInformation</key>
            <false/>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>teamID</key>
            <string>${{ secrets.APPLE_DEVELOPER_TEAM_ID }}</string>
            <key>testFlightInternalTestingOnly</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF

      - name: Upload to TestFlight
        # Do not upload to TestFlight if we are running in the Template repository.
        if: ${{ !github.event.repository.is_template }}
        run: |
          xcodebuild -exportArchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "${{ steps.app-store-connect-key.outputs.path }}" \
            -authenticationKeyID ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }} \
            -archivePath "${{ runner.temp }}/${{ env.ARCHIVE_PATH }}" \
            -exportOptionsPlist ${{ env.EXPORT_OPTIONS_PLIST_PATH }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.environment.scheme }}-${{ github.sha }}.xcarchive
          path: ${{ runner.temp }}/${{ env.ARCHIVE_PATH }}

      - name: Add job summary
        run: |
          {
            echo "## iOS release artifacts"
            echo "- Version name: \`${{ steps.app_meta.outputs.version_name }}\`"
            echo "- Version code: \`${{ steps.app_meta.outputs.version_code }}\`"
            echo "- Artifact: ${{ matrix.environment.scheme }}-${{ github.sha }}.xcarchive"
          } >> "$GITHUB_STEP_SUMMARY"
