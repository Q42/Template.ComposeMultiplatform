name: Android tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: android-ci-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-android:
    name: Test Android app
    # To use the self-hosted runner, change to `runs-on: [self-hosted, macOS]`
    runs-on: [macos-26]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Check dependency licenses
        run: ./gradlew licensee --stacktrace

      - name: Build Android debug APK
        run: ./gradlew :androidApp:assembleDebug --stacktrace

      - name: Run checks (excluding iOS simulator tests)
        run: ./gradlew check --stacktrace -x iosSimulatorArm64Test
