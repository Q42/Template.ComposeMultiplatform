name: iOS tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ios-ci-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODE_VERSION: '26'
  XCODE_PROJECT: iosApp/iosApp.xcodeproj
  SCHEME: iosApp

jobs:
  test-ios:
    name: Test iOS app
    runs-on: [ self-hosted, macOS ]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "corretto"
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Cache Swift Package Manager dependencies
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Cache Kotlin Native toolchain
        uses: actions/cache@v5
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('**/libs.versions.toml', '**/gradle-wrapper.properties') }}
          restore-keys: |
            konan-${{ runner.os }}-

      - name: Install Swift packages
        run: |
          xcodebuild -project "${{ env.XCODE_PROJECT }}" \
            -scheme "${{ env.SCHEME }}" \
            -onlyUsePackageVersionsFromResolvedFile \
            -resolvePackageDependencies \
            -clonedSourcePackagesDirPath "${{ runner.temp }}/SourcePackages"

      - name: Verify Xcode + KMP project configuration
        run: ./gradlew :shared:checkXcodeProjectConfiguration --stacktrace

      # :shared:iosSimulatorArm64Test is excluded: shared's commonMain calls the Datadog KMP
      # SDK directly (see shared/src/commonMain/.../logging/DatadogBootstrap.kt), and Kotlin/Native
      # can only link its iOS framework via Xcode's own SPM resolution — not via Gradle's CLI
      # linker, which is what this task invokes. Other modules don't depend on Datadog directly
      # (only on the plain AppLoggerApi interface in core:utils) and are unaffected.
      - name: Run iOS simulator Kotlin tests
        run: ./gradlew iosSimulatorArm64Test --stacktrace -x :shared:iosSimulatorArm64Test

      - name: Build iOS app
        run: |
          xcodebuild build \
            -project "${{ env.XCODE_PROJECT }}" \
            -scheme "${{ env.SCHEME }}" \
            -destination generic/platform=iOS \
            -clonedSourcePackagesDirPath "${{ runner.temp }}/SourcePackages" \
            CODE_SIGNING_ALLOWED=NO
