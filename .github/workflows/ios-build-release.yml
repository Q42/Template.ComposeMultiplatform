name: iOS build release


on:
  pull_request:
  push:
#on:
#  push:
#    branches:
#      - develop

permissions:
  contents: read

concurrency:
  group: ios-cd-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-artifacts:
    runs-on: [ self-hosted, macOS ]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "corretto"
          java-version: "21"
          cache: gradle

      - name: Resolve app version metadata
        id: app_meta
        shell: bash
        run: |
          VERSION_OUTPUT=$(./gradlew -q :composeApp:printAppVersionMetadata)
          VERSION_NAME=$(echo "$VERSION_OUTPUT" | grep '^VERSION_NAME=' | head -n1 | cut -d'=' -f2-)
          VERSION_CODE=$(echo "$VERSION_OUTPUT" | grep '^VERSION_CODE=' | head -n1 | cut -d'=' -f2-)

          if [[ -z "$VERSION_NAME" ]]; then VERSION_NAME="unknown"; fi
          if [[ -z "$VERSION_CODE" ]]; then VERSION_CODE="unknown"; fi

          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Build iOS simulator app (Debug)
        run: xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp -configuration Debug -destination 'generic/platform=iOS Simulator' -derivedDataPath ${{ github.workspace }}/ios-derived-data build CODE_SIGNING_ALLOWED=NO | cat

      - name: Package iOS simulator app bundle
        run: |
          APP_PATH="${{ github.workspace }}/ios-derived-data/Build/Products/Debug-iphonesimulator/iosApp.app"
          OUTPUT_ZIP="${{ github.workspace }}/ios-derived-data/Build/Products/Debug-iphonesimulator/iosApp-simulator.app.zip"
          ditto -c -k --keepParent "$APP_PATH" "$OUTPUT_ZIP"

      - name: Upload iOS simulator app artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ github.event.repository.name }}-${{ github.run_number }}-v${{ steps.app_meta.outputs.version_name }}-${{ steps.app_meta.outputs.version_code }}-ios-debug-app-simulator
          path: ${{ github.workspace }}/ios-derived-data/Build/Products/Debug-iphonesimulator/iosApp-simulator.app.zip
          if-no-files-found: error
          retention-days: 30

      - name: Add workflow summary
        run: |
          {
            echo "## iOS release artifacts"
            echo "- Version name: \`${{ steps.app_meta.outputs.version_name }}\`"
            echo "- Version code: \`${{ steps.app_meta.outputs.version_code }}\`"
            echo "- Artifact: debug iOS simulator app archive (iosApp-simulator.app.zip containing iosApp.app)"
          } >> "$GITHUB_STEP_SUMMARY"
